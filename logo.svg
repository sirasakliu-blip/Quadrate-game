<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Emblem Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Colors -->
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logoPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="logoAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Q Shape) -->
  <g transform="translate(10, 10)" filter="url(#logoGlow)">
    <rect width="100" height="100" rx="22" fill="url(#logoBgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    
    <!-- Top Cyan -->
    <rect x="36" y="16" width="16" height="16" rx="3" fill="url(#logoCyan)"/>
    <rect x="54" y="16" width="16" height="16" rx="3" fill="url(#logoCyan)"/>
    
    <!-- Left Purple -->
    <rect x="18" y="16" width="16" height="16" rx="3" fill="url(#logoPurple)"/>
    <rect x="18" y="34" width="16" height="16" rx="3" fill="url(#logoPurple)"/>
    <rect x="18" y="52" width="16" height="16" rx="3" fill="url(#logoPurple)"/>

    <!-- Right Blue -->
    <rect x="72" y="16" width="16" height="16" rx="3" fill="url(#logoBlue)"/>
    <rect x="72" y="34" width="16" height="16" rx="3" fill="url(#logoBlue)"/>
    <rect x="72" y="52" width="16" height="16" rx="3" fill="url(#logoBlue)"/>

    <!-- Bottom Green -->
    <rect x="18" y="70" width="16" height="16" rx="3" fill="url(#logoGreen)"/>
    <rect x="36" y="70" width="16" height="16" rx="3" fill="url(#logoGreen)"/>
    <rect x="54" y="70" width="16" height="16" rx="3" fill="url(#logoGreen)"/>

    <!-- Core Red -->
    <rect x="42" y="42" width="16" height="16" rx="3" fill="url(#logoRed)"/>

    <!-- Tail Amber -->
    <rect x="68" y="66" width="16" height="16" rx="3" fill="url(#logoAmber)"/>
    <rect x="78" y="76" width="14" height="14" rx="3" fill="url(#logoAmber)"/>
  </g>

  <!-- Typography: QUADRATE GAME -->
  <g transform="translate(130, 20)">
    <!-- QUADRATE -->
    <text x="0" y="52" font-family="'Chakra Petch', 'Kanit', sans-serif" font-weight="900" font-size="46" fill="url(#textGrad)" letter-spacing="3">QUADRATE</text>
    
    <!-- Colored Accent Blocks on letter E -->
    <rect x="254" y="20" width="8" height="8" rx="2" fill="#38bdf8"/>
    <rect x="254" y="32" width="8" height="8" rx="2" fill="#f59e0b"/>
    <rect x="254" y="44" width="8" height="8" rx="2" fill="#22c55e"/>

    <!-- Subtitle: GAME (Block Puzzle Engine) -->
    <g transform="translate(2, 74)">
      <text x="0" y="14" font-family="'Chakra Petch', 'Prompt', sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="8">BLOCK PUZZLE</text>
      <rect x="156" y="7" width="115" height="2" fill="rgba(56, 189, 248, 0.4)"/>
    </g>
  </g>
</svg>
